name: Stemproefjes maken

on:
  push:
    branches: [main]
    paths: ["scripts/voice_samples.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q edge-tts
      - run: python scripts/voice_samples.py
      - name: Commit samples
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A docs/samples
          git diff --cached --quiet || (git commit -m "Stemproefjes" && git pull --rebase -q origin main && git push)
